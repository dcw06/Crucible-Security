name: Crucible CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -c constraints.txt -r requirements.txt pytest==9.0.3 pytest-cov pip-audit ruff mypy
      - run: cmp -s requirements.txt constraints.txt
      - run: python -m pip_audit
      - run: ruff check . --select E9,F63,F7,F82
      - name: Scan tracked files for common secret formats
        run: |
          if git grep -nE '(AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|sk-ant-[A-Za-z0-9_-]{20,})' -- \
            ':!*.example' ':!**/*.example'; then
            echo "Potential committed secret detected"
            exit 1
          fi
      - run: mypy --ignore-missing-imports confidence.py scan_models.py test_sandbox.py
      - run: python -m pytest tests -q --cov=confidence --cov=auth --cov=scan_models --cov=test_sandbox --cov-fail-under=60
      - run: python -m compileall -q .
      - run: docker build -t crucible-ci .
