name: Workspace CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            mcp-server/package-lock.json
            vscode-extension/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest test_generated_code.py -q
      - run: PYTHONPATH=crucible python -m pytest crucible/tests -q
      - run: npm ci --prefix mcp-server
      - run: npm run build --prefix mcp-server
      - run: npm ci --prefix vscode-extension
      - run: npm run compile --prefix vscode-extension
