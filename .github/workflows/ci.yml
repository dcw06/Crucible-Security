name: Workspace CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip_audit
      - run: python -m pip_audit -r desktop-worker/requirements.txt
      - run: ruff check . --select E9,F63,F7,F82
      - run: mypy --ignore-missing-imports code_pipeline.py research_pipeline.py
      - name: Scan tracked files for common secret formats
        run: |
          if git grep -nE '(AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|sk-ant-[A-Za-z0-9_-]{20,})' -- \
            ':!*.example' ':!**/*.example'; then
            echo "Potential committed secret detected"
            exit 1
          fi
      - run: make test PYTHON=python
      - run: make test-desktop-worker PYTHON=python

  node:
    strategy:
      matrix:
        node: ["20", "22"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
      - uses: actions/setup-node@1e60f620b9541d0106c07b8da23f78a5edc7c8b5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            browser-worker/package-lock.json
            mcp-server/package-lock.json
            vscode-extension/package-lock.json
      - run: npm ci --prefix browser-worker
      - run: npm ci --prefix mcp-server
      - run: npm ci --prefix vscode-extension
      - run: npm audit --audit-level=high --prefix browser-worker
      - run: npm audit --audit-level=high --prefix mcp-server
      - run: npm audit --audit-level=high --prefix vscode-extension
      - run: npm run lint --prefix browser-worker
      - run: make test-worker
      - run: make build
      - run: make test-typescript

  worker-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
      - run: docker build -f browser-worker/Dockerfile -t crucible-browser-worker:test browser-worker
      - run: docker build -f desktop-worker/Dockerfile.linux -t crucible-desktop-worker:test desktop-worker
